[project]
name = "residencial-aurora"
version = "0.1.0"
description = "Assistente seguro do Residencial Aurora com Google ADK"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiosqlite>=0.20.0",
  "fastapi>=0.115.0",
  "google-adk[db]==2.9.1",
  "greenlet>=3.1.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
]

[project.scripts]
aurora-api = "aurora.api:run"
aurora-reset = "aurora.cli:reset"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
